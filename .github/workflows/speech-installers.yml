# Builds the speech server's installers (Setup.exe for Windows, .pkg for macOS), installs
# the server with each platform's script on a clean runner and checks it with real
# engines: Piper speaks a sentence, Whisper hears it (MLX on the macOS runner's Apple
# silicon, the processor on Windows). Run by hand (Actions › Run workflow) or by a
# speech-v* tag. The installers are kept as the run's artifacts.
name: Speech server installers

on:
  workflow_dispatch:
  push:
    tags: ['speech-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build Setup.exe
        shell: pwsh
        run: ./installer/windows/build-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist-installers/*.exe
      - name: Install with Setup.exe (silent, processor)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $setup = Get-ChildItem dist-installers/*.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          # Not -Wait: in PowerShell 7 it also waits for the server Setup.exe leaves running.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=localonly', "/LOG=`"$log`"" -PassThru
          $null = $p.Handle
          $p.WaitForExit()
          Get-Content $log -Tail 30
          if ($p.ExitCode -ne 0) { throw "Setup.exe exited with $($p.ExitCode)" }
          Invoke-RestMethod http://127.0.0.1:8765/health | ConvertTo-Json -Compress
          # Python's own pythonw.exe runs it, not the environment's launcher (antivirus programs remove that one).
          $server = Get-CimInstance Win32_Process -Filter "Name='pythonw.exe'" | Where-Object { $_.CommandLine -like '*launch.py*' } | Select-Object -First 1
          if (-not $server -or $server.ExecutablePath -like '*\venv\*') { throw "the server runs from $($server.ExecutablePath)" }
          "server: $($server.ExecutablePath)"
      - name: Real engines
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'LiveInterpreterSpeech'
          & "$app\venv\Scripts\python.exe" speech-server/tests/smoke_real.py --config "$app\speech.env"
      - name: Log
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:LOCALAPPDATA 'LiveInterpreterSpeech\logs\server.log') -ErrorAction SilentlyContinue
      - name: Diagnose
        if: failure()
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'LiveInterpreterSpeech'
          Get-CimInstance Win32_Process -Filter "Name='pythonw.exe' OR Name='python.exe'" | Select-Object ProcessId, CommandLine | Format-List
          netstat -ano | Select-String ':8765'
          Get-CimInstance Win32_Process -Filter "Name='pythonw.exe'" | Where-Object { $_.CommandLine -like "*$app*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $out = Join-Path $env:RUNNER_TEMP 'server-out.txt'; $err = Join-Path $env:RUNNER_TEMP 'server-err.txt'
          $p = Start-Process -FilePath "$app\venv\Scripts\python.exe" -ArgumentList "`"$app\app\server.py`" --config `"$app\speech.env`"" -WorkingDirectory "$app\app" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 3; try { Invoke-RestMethod http://127.0.0.1:8765/health -TimeoutSec 3 | ConvertTo-Json -Compress; break } catch { if ($p.HasExited) { "exited with $($p.ExitCode)"; break } } }
          '--- stdout'; Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 40
          '--- stderr'; Get-Content $err -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch 'HTTP Request' } | Select-Object -Last 60
      - name: Uninstall with the uninstaller
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'LiveInterpreterSpeech'
          $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          for ($i = 0; $i -lt 120 -and (Test-Path (Join-Path $app 'venv')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'venv')) { throw 'the uninstaller left the server behind' }
          if (Get-CimInstance Win32_Process -Filter "Name='pythonw.exe'" | Where-Object { $_.CommandLine -like "*$app*" }) { throw 'the server still runs' }
          'removed'

  # GitHub's Apple silicon runners are sometimes not available for hours. The repository
  # variable MAC_RUNNER can send this job to a self-hosted Mac instead, as a JSON label
  # list such as ["self-hosted","macOS","ARM64","speech-mac"]. That runner must run as a
  # macOS user of its own: the job installs and removes the server in that user's Library.
  macos:
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"macos-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the .pkg
        run: bash installer/mac/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist-installers/*.pkg
      - name: Install with the script (two voices, MLX)
        run: LANGS="en tr" bash speech-server/install-mac.sh --local-only
      - name: Real engines
        run: |
          app="$HOME/Library/Application Support/LiveInterpreterSpeech"
          "$app/venv/bin/python" speech-server/tests/smoke_real.py --config "$app/speech.env"
      - name: Log
        if: always()
        run: cat "$HOME/Library/Application Support/LiveInterpreterSpeech/logs/server.log" || true
      - name: Uninstall
        run: bash speech-server/install-mac.sh --uninstall
